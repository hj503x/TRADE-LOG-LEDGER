<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGER — Trade Log</title>
<style>
  :root{
    --bg: #14161b;
    --panel: #1a1d24;
    --line: #2a2e38;
    --ink: #d8dbe2;
    --dim: #7b8092;
    --hit: #4fae7a;
    --miss: #c15a5a;
    --accent: #d8b26a;
    --mono: 'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:24px 16px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-size:15px;
    letter-spacing:0.18em;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  header h1 span{color:var(--accent);}
  header .sub{font-size:11px;color:var(--dim);letter-spacing:0.04em;}

  .stats{
    display:flex;
    gap:0;
    border:1px solid var(--line);
    margin-bottom:8px;
    overflow:hidden;
    border-radius:2px;
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
  }
  .stat{
    flex:1;
    padding:10px 14px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat .n{font-size:17px;font-weight:600;color:var(--ink);}
  .stat .l{font-size:9px;color:var(--dim);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
  .stat.hitcolor .n{color:var(--hit);}

  .breakdown{
    font-size:10px;
    color:var(--dim);
    margin:0 0 16px;
    letter-spacing:0.02em;
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    padding:0 2px;
  }
  .breakdown b{color:var(--ink);font-weight:600;}

  form{
    display:grid;
    grid-template-columns: 70px 1fr 130px 90px 90px 80px 84px;
    gap:8px;
    margin-bottom:18px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:10px;
    border-radius:2px;
  }
  form label{
    font-size:9px;
    color:var(--dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  input, select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--mono);
    font-size:12px;
    padding:7px 6px;
    border-radius:2px;
    outline:none;
  }
  input:focus, select:focus{border-color:var(--accent);}
  input[readonly]{color:var(--dim);}
  button{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    cursor:pointer;
    border-radius:2px;
  }
  .addbtn{
    align-self:end;
    background:var(--accent);
    border:1px solid var(--accent);
    color:#14161b;
    font-weight:700;
    padding:8px 0;
    text-transform:uppercase;
  }
  .addbtn:hover{opacity:0.88;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  thead th{
    text-align:left;
    font-size:9px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--dim);
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    font-weight:500;
  }
  tbody td{
    padding:8px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  td.num{color:var(--dim);}
  .tag{
    display:inline-block;
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:2px;
    border:1px solid;
  }
  .tag.long{color:#8fb5d8;border-color:#3a5a78;}
  .tag.short{color:#d8a98f;border-color:#785a3a;}
  .tag.hit{color:var(--hit);border-color:var(--hit);}
  .tag.miss{color:var(--miss);border-color:var(--miss);}
  .tag.breakeven{color:var(--accent);border-color:var(--accent);}
  .tag.pending{color:var(--dim);border-color:var(--dim);}
  .tag.result-tag{cursor:pointer;}
  .tag.result-tag:hover{opacity:0.75;}
  .rr{color:var(--accent);}
  .rr-edit{cursor:pointer;}
  .rr-edit:hover{opacity:0.75;}
  .del{
    background:none;
    border:none;
    color:var(--dim);
    font-size:13px;
  }
  .del:hover{color:var(--miss);}
  .edit{
    background:none;
    border:none;
    color:var(--dim);
    font-size:13px;
    margin-right:4px;
  }
  .edit:hover{color:var(--accent);}
  .dup{
    background:none;
    border:none;
    color:var(--dim);
    font-size:13px;
    margin-right:4px;
  }
  .dup:hover{color:#8fb5d8;}
  .empty{
    text-align:center;
    color:var(--dim);
    padding:30px 0;
    font-size:11px;
    letter-spacing:0.04em;
  }

  .actions{
    display:flex;
    gap:8px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .actions button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    padding:8px 14px;
  }
  .actions button:hover{color:var(--ink);border-color:var(--dim);}

  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .toolbar input, .toolbar select{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--mono);
    font-size:11px;
    padding:7px 10px;
    border-radius:2px;
    outline:none;
  }
  .toolbar input{flex:1;min-width:120px;}
  .toolbar input:focus, .toolbar select:focus{border-color:var(--accent);}

  .month-row td{
    background:var(--panel);
    color:var(--accent);
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:8px 8px;
    border-bottom:1px solid var(--line);
    font-weight:600;
  }
  .month-row .mstats{
    color:var(--dim);
    font-weight:400;
    letter-spacing:0.02em;
    text-transform:none;
    float:right;
  }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:10px 16px;
    border-radius:4px;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:50;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .toast button{
    background:none;
    border:none;
    color:var(--accent);
    font-weight:700;
    cursor:pointer;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  .report-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:60;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:24px 16px;
  }
  .report-panel{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    max-width:640px;
    width:100%;
    padding:20px;
  }
  .report-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
    margin-bottom:14px;
  }
  .report-head h2{
    font-size:14px;
    letter-spacing:0.14em;
    margin:0;
    font-weight:600;
  }
  .report-head h2 span{color:var(--accent);}
  .report-close{
    background:none;
    border:none;
    color:var(--dim);
    font-size:16px;
  }
  .report-close:hover{color:var(--ink);}
  #reportPeriod{
    margin-bottom:16px;
    width:auto;
    min-width:150px;
  }
  .r-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .r-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:12px;
  }
  .r-card .rn{font-size:19px;font-weight:600;}
  .r-card .rl{font-size:9px;color:var(--dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px;}
  .r-section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px;
    margin-bottom:14px;
  }
  .r-section-title{
    font-size:10px;
    color:var(--dim);
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .r-bar-row{margin-bottom:10px;}
  .r-bar-row:last-child{margin-bottom:0;}
  .r-bar-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:4px;
  }
  .r-bar-track{
    height:6px;
    background:var(--bg);
    border-radius:3px;
    overflow:hidden;
  }
  .r-bar-fill{height:100%;background:var(--hit);}
  .r-months{
    display:flex;
    align-items:flex-end;
    gap:8px;
    height:80px;
  }
  .r-month-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .r-month-bar{
    width:100%;
    background:var(--line);
    border-radius:2px 2px 0 0;
    min-height:2px;
  }
  .r-month-lbl{font-size:9px;color:var(--dim);}
  .r-asset-table{width:100%;font-size:12px;border-collapse:collapse;}
  .r-asset-table td{padding:6px 0;border-bottom:1px solid var(--line);}
  .r-asset-table tr:last-child td{border-bottom:none;}
  .r-asset-table td.right{text-align:right;}
  .report-actions{display:flex;gap:8px;}
  .report-actions button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    padding:8px 14px;
  }
  .report-actions button:hover{color:var(--ink);border-color:var(--dim);}

  @media (max-width: 640px){
    form{grid-template-columns: 1fr 1fr;}
    table{display:block;overflow-x:auto;}
  }

  @media print{
    body{background:#fff;color:#000;padding:0;}
    form,.actions,.stats,.toolbar,#editBar,.breakdown,.toast{display:none;}
    header{border-color:#000;}
    header h1, header h1 span{color:#000;}
    thead th{color:#000;border-color:#000;}
    tbody td{border-color:#ccc;}
    .tag{border-color:#000 !important;color:#000 !important;}
    .rr{color:#000;}
    .month-row td{background:#eee;color:#000;}
    .dup, .edit, .del{display:none;}

    body:not(.pr-data) table{display:none;}
    body:not(.pr-data) #emptyMsg{display:none;}

    body:not(.pr-report) .report-overlay{display:none;}
    body.pr-report .report-overlay{
      position:static;
      background:#fff;
      padding:0;
      display:block;
      margin-top:20px;
    }
    body.pr-report .report-panel{
      max-width:none;
      border:none;
      padding:0;
    }
    body.pr-report .report-head, body.pr-report .report-actions, body.pr-report #reportPeriod{display:none;}
    body.pr-report .r-card, body.pr-report .r-section{
      background:#fff;
      border:1px solid #ccc;
      color:#000;
    }
    body.pr-report .r-card .rl, body.pr-report .r-section-title{color:#555;}
    body.pr-report .r-bar-fill{background:#000;}
    body.pr-report .r-month-bar{background:#999;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>LEDGER<span>_</span> TRADE LOG</h1>
    <div class="sub" id="dateNow"></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Trades</div></div>
    <div class="stat hitcolor"><div class="n" id="statHitRate">—</div><div class="l">Hit Rate</div></div>
    <div class="stat"><div class="n" id="statAvgRR">—</div><div class="l">Avg R:R</div></div>
  </div>
  <div class="breakdown" id="breakdown"></div>

  <form id="tradeForm">
    <div>
      <label>No.</label>
      <input type="text" id="fSerial" readonly>
    </div>
    <div>
      <label>Asset</label>
      <input type="text" id="fAsset" placeholder="XAUUSD" required autocomplete="off">
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="fDate" required>
    </div>
    <div>
      <label>Dir</label>
      <select id="fDir">
        <option value="long">Long</option>
        <option value="short">Short</option>
      </select>
    </div>
    <div>
      <label>Result</label>
      <select id="fResult">
        <option value="pending" selected>Pending</option>
        <option value="hit">Hit</option>
        <option value="miss">Miss</option>
        <option value="breakeven">Break Even</option>
      </select>
    </div>
    <div>
      <label>R:R</label>
      <input type="text" id="fRR" placeholder="1:2" autocomplete="off">
    </div>
    <button type="submit" class="addbtn" id="submitBtn">+ Add</button>
  </form>
  <div id="editBar" style="display:none;margin:-10px 0 18px;">
    <button id="btnCancelEdit" style="background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;font-family:var(--mono);font-size:11px;border-radius:2px;cursor:pointer;">Cancel edit</button>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search asset...">
    <select id="sortSelect">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="asset">Asset A–Z</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>No.</th>
        <th>Asset</th>
        <th>Date</th>
        <th>Dir</th>
        <th>Result</th>
        <th>R:R</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">No entries yet — log your first trade above.</div>

  <div class="actions">
    <button id="btnReport">View Report</button>
    <button id="btnPrint">Print / Save PDF</button>
    <button id="btnCSV">Export CSV</button>
    <button id="btnJSONExport">Backup JSON</button>
    <button id="btnJSONImport">Restore JSON</button>
    <button id="btnClear">Clear All</button>
  </div>
  <p style="font-size:10px;color:var(--dim);margin:8px 2px 0;letter-spacing:0.02em;">Updating to a new version of this file? Tap <b style="color:var(--ink);">Backup JSON</b> first, then open the new file and tap <b style="color:var(--ink);">Restore JSON</b> to bring your trades back — no re-entry needed.</p>
  <input type="file" id="fileImport" accept="application/json" style="display:none;">

</div>
<div id="reportOverlay" class="report-overlay" style="display:none;">
  <div class="report-panel">
    <div class="report-head">
      <h2>LEDGER<span>_</span> REPORT</h2>
      <button id="btnCloseReport" class="report-close">✕</button>
    </div>
    <select id="reportPeriod">
      <option value="all">All time</option>
      <option value="thismonth">This month</option>
      <option value="lastmonth">Last month</option>
    </select>
    <div id="reportBody"></div>
    <div class="report-actions">
      <button id="btnPrintReport">Print / Save PDF</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" style="display:none;"></div>

<script>
const STORAGE_KEY = 'ledger_trades_v1';
let trades = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;

const tbody = document.getElementById('tbody');
const emptyMsg = document.getElementById('emptyMsg');
const fSerial = document.getElementById('fSerial');
const fAsset = document.getElementById('fAsset');
const fDate = document.getElementById('fDate');
const fDir = document.getElementById('fDir');
const fResult = document.getElementById('fResult');
const fRR = document.getElementById('fRR');
const searchBox = document.getElementById('searchBox');
const sortSelect = document.getElementById('sortSelect');

document.getElementById('dateNow').textContent = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
fDate.valueAsDate = new Date();

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
}

function nextSerial(){
  return trades.length ? trades[trades.length-1].serial + 1 : 1;
}

function monthKey(dateStr){
  const dt = new Date(dateStr + 'T00:00:00');
  if(isNaN(dt)) return 'unknown';
  return dt.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
}

function computeGroupStats(list){
  const winLoss = list.filter(t=>t.result==='hit' || t.result==='miss');
  const nonPending = list.filter(t=>t.result!=='pending');
  const hits = list.filter(t=>t.result==='hit').length;
  const hitRate = winLoss.length ? Math.round((hits/winLoss.length)*100) + '%' : '—';
  const rrVals = nonPending.map(t=>parseRR(t.rr)).filter(v=>v!==null);
  const avgRR = rrVals.length ? '1:' + (rrVals.reduce((a,b)=>a+b,0)/rrVals.length).toFixed(1) : '—';
  return `${list.length} trades · ${hitRate} hit · ${avgRR} avg`;
}

function render(){
  if(editingId === null){
    fSerial.value = nextSerial();
  }
  tbody.innerHTML = '';

  const query = searchBox.value.trim().toUpperCase();
  const sortMode = sortSelect.value;

  let filtered = trades.filter(t => !query || t.asset.includes(query));

  if(trades.length === 0){
    emptyMsg.style.display = 'block';
    updateStats();
    return;
  }
  if(filtered.length === 0){
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = 'No trades match your search.';
    updateStats();
    return;
  }
  emptyMsg.style.display = 'none';
  emptyMsg.textContent = 'No entries yet — log your first trade above.';

  // sort within groups
  let sorted = [...filtered];
  if(sortMode === 'newest'){
    sorted.sort((a,b)=> b.date.localeCompare(a.date) || b.serial - a.serial);
  } else if(sortMode === 'oldest'){
    sorted.sort((a,b)=> a.date.localeCompare(b.date) || a.serial - b.serial);
  } else if(sortMode === 'asset'){
    sorted.sort((a,b)=> a.asset.localeCompare(b.asset));
  }

  // group by month (skip grouping entirely if sorting by asset — grouping only makes sense chronologically)
  if(sortMode === 'asset'){
    sorted.forEach(t => tbody.appendChild(rowEl(t)));
  } else {
    const groups = new Map();
    sorted.forEach(t=>{
      const key = monthKey(t.date);
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });
    groups.forEach((list, key)=>{
      const mrow = document.createElement('tr');
      mrow.className = 'month-row';
      mrow.innerHTML = `<td colspan="7">${key} <span class="mstats">${computeGroupStats(list)}</span></td>`;
      tbody.appendChild(mrow);
      list.forEach(t => tbody.appendChild(rowEl(t)));
    });
  }

  updateStats();
}

function rowEl(t){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="num">${String(t.serial).padStart(3,'0')}</td>
    <td>${escapeHtml(t.asset)}</td>
    <td class="num">${formatDate(t.date)}</td>
    <td><span class="tag ${t.dir}">${t.dir}</span></td>
    <td><span class="tag ${t.result} result-tag" data-id="${t.id}" title="Tap to update">${t.result}</span></td>
    <td class="rr rr-edit" data-id="${t.id}" title="Tap to set R:R">${t.rr ? escapeHtml(t.rr) : '—'}</td>
    <td>
      <button class="dup" data-id="${t.id}" title="Duplicate">⧉</button>
      <button class="edit" data-id="${t.id}" title="Edit">✎</button>
      <button class="del" data-id="${t.id}" title="Delete">✕</button>
    </td>
  `;
  return tr;
}

function updateBreakdown(){
  const el = document.getElementById('breakdown');
  if(trades.length === 0){ el.innerHTML = ''; return; }

  const longs = trades.filter(t=>t.dir==='long' && (t.result==='hit'||t.result==='miss'));
  const shorts = trades.filter(t=>t.dir==='short' && (t.result==='hit'||t.result==='miss'));
  const longRate = longs.length ? Math.round(longs.filter(t=>t.result==='hit').length/longs.length*100)+'%' : '—';
  const shortRate = shorts.length ? Math.round(shorts.filter(t=>t.result==='hit').length/shorts.length*100)+'%' : '—';

  const assetMap = new Map();
  trades.forEach(t=>{
    if(!assetMap.has(t.asset)) assetMap.set(t.asset, {total:0, hits:0, resolved:0});
    const a = assetMap.get(t.asset);
    a.total++;
    if(t.result==='hit'||t.result==='miss'){
      a.resolved++;
      if(t.result==='hit') a.hits++;
    }
  });
  let mostTraded = null, mostCount = 0;
  let bestAsset = null, bestRate = -1;
  assetMap.forEach((v,k)=>{
    if(v.total > mostCount){ mostCount = v.total; mostTraded = k; }
    if(v.resolved >= 3){
      const rate = v.hits / v.resolved;
      if(rate > bestRate){ bestRate = rate; bestAsset = k; }
    }
  });

  let html = `Long <b>${longRate}</b> · Short <b>${shortRate}</b>`;
  if(mostTraded) html += ` · Most traded <b>${escapeHtml(mostTraded)}</b> (${mostCount})`;
  if(bestAsset) html += ` · Best asset <b>${escapeHtml(bestAsset)}</b> (${Math.round(bestRate*100)}%)`;
  el.innerHTML = html;
}

function updateStats(){
  const total = trades.length;
  document.getElementById('statTotal').textContent = total;
  if(total === 0){
    document.getElementById('statHitRate').textContent = '—';
    document.getElementById('statAvgRR').textContent = '—';
    updateBreakdown();
    return;
  }
  const resolved = trades.filter(t=>t.result==='hit' || t.result==='miss');
  const nonPending = trades.filter(t=>t.result!=='pending');
  const hits = trades.filter(t=>t.result==='hit').length;
  document.getElementById('statHitRate').textContent = resolved.length
    ? Math.round((hits/resolved.length)*100) + '%'
    : '—';

  const rrVals = nonPending.map(t=>parseRR(t.rr)).filter(v=>v!==null);
  if(rrVals.length){
    const avg = rrVals.reduce((a,b)=>a+b,0)/rrVals.length;
    document.getElementById('statAvgRR').textContent = '1:' + avg.toFixed(1);
  } else {
    document.getElementById('statAvgRR').textContent = '—';
  }
  updateBreakdown();
}

function parseRR(rr){
  // accepts "1:2", "1:2.5", or plain "2"
  const m = rr.match(/^\s*1?\s*:?\s*([\d.]+)\s*$/);
  return m ? parseFloat(m[1]) : null;
}

function computeReportData(periodFilter){
  const now = new Date();
  let list = trades;
  if(periodFilter === 'thismonth'){
    const y = now.getFullYear(), m = now.getMonth();
    list = trades.filter(t=>{
      const dt = new Date(t.date + 'T00:00:00');
      return dt.getFullYear() === y && dt.getMonth() === m;
    });
  } else if(periodFilter === 'lastmonth'){
    const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const y = d.getFullYear(), m = d.getMonth();
    list = trades.filter(t=>{
      const dt = new Date(t.date + 'T00:00:00');
      return dt.getFullYear() === y && dt.getMonth() === m;
    });
  }

  const winLoss = list.filter(t=>t.result==='hit' || t.result==='miss');
  const nonPending = list.filter(t=>t.result!=='pending');
  const hits = list.filter(t=>t.result==='hit').length;
  const hitRate = winLoss.length ? Math.round((hits/winLoss.length)*100) : null;
  const rrVals = nonPending.map(t=>parseRR(t.rr)).filter(v=>v!==null);
  const avgRR = rrVals.length ? (rrVals.reduce((a,b)=>a+b,0)/rrVals.length) : null;

  // longest hit streak (chronological, hit/miss only)
  const chronological = [...winLoss].sort((a,b)=> a.date.localeCompare(b.date) || a.serial - b.serial);
  let longestStreak = 0, current = 0;
  chronological.forEach(t=>{
    if(t.result === 'hit'){ current++; longestStreak = Math.max(longestStreak, current); }
    else { current = 0; }
  });

  const longs = list.filter(t=>t.dir==='long' && (t.result==='hit'||t.result==='miss'));
  const shorts = list.filter(t=>t.dir==='short' && (t.result==='hit'||t.result==='miss'));
  const longRate = longs.length ? Math.round(longs.filter(t=>t.result==='hit').length/longs.length*100) : null;
  const shortRate = shorts.length ? Math.round(shorts.filter(t=>t.result==='hit').length/shorts.length*100) : null;

  // monthly trend (chronological months present in list, capped to last 6)
  const monthMap = new Map();
  chronological.forEach(t=>{
    const key = monthKey(t.date);
    if(!monthMap.has(key)) monthMap.set(key, {hits:0, total:0});
    const m = monthMap.get(key);
    m.total++;
    if(t.result==='hit') m.hits++;
  });
  let months = Array.from(monthMap.entries()).map(([key, v])=>({
    key, rate: v.total ? Math.round(v.hits/v.total*100) : 0
  }));
  if(months.length > 6) months = months.slice(months.length-6);

  // asset performance
  const assetMap = new Map();
  list.forEach(t=>{
    if(!assetMap.has(t.asset)) assetMap.set(t.asset, {total:0, hits:0, resolved:0});
    const a = assetMap.get(t.asset);
    a.total++;
    if(t.result==='hit'||t.result==='miss'){
      a.resolved++;
      if(t.result==='hit') a.hits++;
    }
  });
  let assets = Array.from(assetMap.entries()).map(([asset,v])=>({
    asset, total:v.total, rate: v.resolved ? Math.round(v.hits/v.resolved*100) : null
  }));
  assets.sort((a,b)=> (b.rate ?? -1) - (a.rate ?? -1));

  return { total: list.length, hitRate, avgRR, longestStreak, longRate, shortRate, months, assets };
}

function renderReport(){
  const period = document.getElementById('reportPeriod').value;
  const d = computeReportData(period);
  const body = document.getElementById('reportBody');

  let html = `
  <div class="r-grid">
    <div class="r-card"><div class="rn">${d.total}</div><div class="rl">Trades</div></div>
    <div class="r-card"><div class="rn">${d.hitRate !== null ? d.hitRate + '%' : '—'}</div><div class="rl">Hit Rate</div></div>
    <div class="r-card"><div class="rn">${d.avgRR !== null ? '1:' + d.avgRR.toFixed(1) : '—'}</div><div class="rl">Avg R:R</div></div>
    <div class="r-card"><div class="rn">${d.longestStreak}</div><div class="rl">Longest Streak</div></div>
  </div>

  <div class="r-section">
    <div class="r-section-title">Direction breakdown</div>
    <div class="r-bar-row">
      <div class="r-bar-label"><span>Long</span><span>${d.longRate !== null ? d.longRate + '%' : '—'}</span></div>
      <div class="r-bar-track"><div class="r-bar-fill" style="width:${d.longRate ?? 0}%"></div></div>
    </div>
    <div class="r-bar-row">
      <div class="r-bar-label"><span>Short</span><span>${d.shortRate !== null ? d.shortRate + '%' : '—'}</span></div>
      <div class="r-bar-track"><div class="r-bar-fill" style="width:${d.shortRate ?? 0}%"></div></div>
    </div>
  </div>
  `;

  if(d.months.length){
    const maxRate = Math.max(...d.months.map(m=>m.rate), 1);
    html += `<div class="r-section">
      <div class="r-section-title">Monthly trend</div>
      <div class="r-months">`;
    d.months.forEach(m=>{
      const h = Math.max(4, Math.round((m.rate / 100) * 70));
      const short = m.key.split(' ')[0].slice(0,3);
      html += `<div class="r-month-col">
        <div class="r-month-bar" style="height:${h}px;"></div>
        <div class="r-month-lbl">${short}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  if(d.assets.length){
    html += `<div class="r-section">
      <div class="r-section-title">Asset performance</div>
      <table class="r-asset-table">`;
    d.assets.forEach(a=>{
      html += `<tr>
        <td>${escapeHtml(a.asset)}</td>
        <td class="right">${a.total} trades</td>
        <td class="right">${a.rate !== null ? a.rate + '%' : '—'}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }

  if(d.total === 0){
    html = `<div class="r-section" style="text-align:center;color:var(--dim);">No trades in this period.</div>`;
  }

  body.innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(d){
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
}

document.getElementById('tradeForm').addEventListener('submit', function(e){
  e.preventDefault();
  const data = {
    asset: fAsset.value.trim().toUpperCase(),
    date: fDate.value,
    dir: fDir.value,
    result: fResult.value,
    rr: fRR.value.trim()
  };
  if(editingId !== null){
    const t = trades.find(tr=>tr.id === editingId);
    if(t) Object.assign(t, data);
    exitEditMode();
  } else {
    trades.push({ id: Date.now(), serial: nextSerial(), ...data });
  }
  save();
  fAsset.value = '';
  fRR.value = '';
  fDate.valueAsDate = new Date();
  fDir.value = 'long';
  fResult.value = 'pending';
  fAsset.focus();
  render();
});

function enterEditMode(id){
  if(editingId !== null && editingId !== id){
    if(!confirm('You have an unsaved edit in progress. Discard it and edit this trade instead?')) return;
  }
  const t = trades.find(tr=>tr.id === id);
  if(!t) return;
  editingId = id;
  fAsset.value = t.asset;
  fDate.value = t.date;
  fDir.value = t.dir;
  fResult.value = t.result;
  fRR.value = t.rr || '';
  fSerial.value = String(t.serial).padStart(3,'0');
  document.getElementById('submitBtn').textContent = '✓ Update';
  document.getElementById('editBar').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
  fAsset.focus();
}

function exitEditMode(){
  editingId = null;
  document.getElementById('submitBtn').textContent = '+ Add';
  document.getElementById('editBar').style.display = 'none';
}

document.getElementById('btnCancelEdit').addEventListener('click', ()=>{
  exitEditMode();
  fAsset.value = '';
  fRR.value = '';
  fDate.valueAsDate = new Date();
  fDir.value = 'long';
  fResult.value = 'pending';
  render();
});

tbody.addEventListener('click', function(e){
  if(e.target.classList.contains('dup')){
    const id = Number(e.target.dataset.id);
    const t = trades.find(tr=>tr.id === id);
    if(t){
      fAsset.value = t.asset;
      fDir.value = t.dir;
      fRR.value = t.rr || '';
      fDate.valueAsDate = new Date();
      fResult.value = 'pending';
      window.scrollTo({top:0, behavior:'smooth'});
      fDate.focus();
    }
    return;
  }
  if(e.target.classList.contains('edit')){
    enterEditMode(Number(e.target.dataset.id));
    return;
  }
  if(e.target.classList.contains('del')){
    const id = Number(e.target.dataset.id);
    if(id === editingId) exitEditMode();
    const idx = trades.findIndex(t=>t.id === id);
    if(idx === -1) return;
    const deleted = trades[idx];
    trades = trades.filter(t=>t.id !== id);
    trades.forEach((t,i)=>t.serial = i+1);
    save();
    render();
    showUndoToast(deleted, idx);
  }
  if(e.target.classList.contains('result-tag')){
    const id = Number(e.target.dataset.id);
    const t = trades.find(tr=>tr.id === id);
    if(t){
      const cycle = {pending:'hit', hit:'miss', miss:'breakeven', breakeven:'pending'};
      t.result = cycle[t.result];
      save();
      render();
    }
  }
  if(e.target.classList.contains('rr-edit')){
    const id = Number(e.target.dataset.id);
    const t = trades.find(tr=>tr.id === id);
    if(t){
      const val = prompt('Set risk:reward (e.g. 1:2)', t.rr || '');
      if(val !== null){
        t.rr = val.trim();
        save();
        render();
      }
    }
  }
});

document.getElementById('btnPrint').addEventListener('click', ()=>{
  const includeReport = confirm('Include the report summary along with your trade data?\n\nOK = Include report\nCancel = Data only');
  document.body.classList.add('pr-data');
  if(includeReport){
    renderReport();
    document.body.classList.add('pr-report');
  }
  window.print();
});

document.getElementById('btnReport').addEventListener('click', ()=>{
  renderReport();
  document.getElementById('reportOverlay').style.display = 'flex';
});

document.getElementById('btnCloseReport').addEventListener('click', ()=>{
  document.getElementById('reportOverlay').style.display = 'none';
});

document.getElementById('reportOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'reportOverlay'){
    document.getElementById('reportOverlay').style.display = 'none';
  }
});

document.getElementById('reportPeriod').addEventListener('change', renderReport);

document.getElementById('btnPrintReport').addEventListener('click', ()=>{
  const includeData = confirm('Include your full trade log table with this report?\n\nOK = Include data\nCancel = Report only');
  document.body.classList.add('pr-report');
  if(includeData) document.body.classList.add('pr-data');
  window.print();
});

window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('pr-report');
  document.body.classList.remove('pr-data');
});

let toastTimer = null;
function showUndoToast(deletedTrade, deletedIndex){
  const toast = document.getElementById('toast');
  toast.innerHTML = 'Trade deleted <button id="undoBtn">Undo</button>';
  toast.style.display = 'flex';
  clearTimeout(toastTimer);
  document.getElementById('undoBtn').onclick = function(){
    trades.splice(deletedIndex, 0, deletedTrade);
    trades.forEach((t,i)=>t.serial = i+1);
    save();
    render();
    toast.style.display = 'none';
    clearTimeout(toastTimer);
  };
  toastTimer = setTimeout(()=>{ toast.style.display = 'none'; }, 3000);
}

document.getElementById('btnClear').addEventListener('click', ()=>{
  if(confirm('Clear all logged trades? This cannot be undone.')){
    trades = [];
    save();
    render();
  }
});

document.getElementById('btnCSV').addEventListener('click', ()=>{
  if(trades.length === 0) return;
  let csv = 'Serial,Asset,Date,Direction,Result,R:R\n';
  trades.forEach(t=>{
    csv += `${t.serial},${t.asset},${t.date},${t.dir},${t.result},${t.rr}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trade-log-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

searchBox.addEventListener('input', render);
sortSelect.addEventListener('change', render);

document.getElementById('btnJSONExport').addEventListener('click', ()=>{
  if(trades.length === 0) return;
  const blob = new Blob([JSON.stringify(trades, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trade-log-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

const fileImport = document.getElementById('fileImport');
document.getElementById('btnJSONImport').addEventListener('click', ()=>fileImport.click());

fileImport.addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const imported = JSON.parse(evt.target.result);
      if(!Array.isArray(imported)) throw new Error('Invalid format');
      const mode = confirm('Click OK to MERGE with existing trades, or Cancel to REPLACE all existing trades with this backup.');
      if(mode){
        // merge: avoid id collisions
        const existingIds = new Set(trades.map(t=>t.id));
        imported.forEach(t=>{
          if(existingIds.has(t.id)) t.id = Date.now() + Math.random();
        });
        trades = trades.concat(imported);
      } else {
        trades = imported;
      }
      // renumber serials by current array order
      trades.forEach((t,i)=>t.serial = i+1);
      save();
      render();
      alert(`Imported ${imported.length} trades.`);
    } catch(err){
      alert('Could not read this file — make sure it\'s a valid backup JSON.');
    }
    fileImport.value = '';
  };
  reader.readAsText(file);
});

const fieldOrder = [fAsset, fDate, fDir, fResult, fRR];
fieldOrder.forEach((el, idx)=>{
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      const next = fieldOrder[idx+1];
      if(next){
        next.focus();
        if(typeof next.select === 'function') next.select();
      } else {
        const form = document.getElementById('tradeForm');
        if(form.requestSubmit) form.requestSubmit();
        else document.getElementById('submitBtn').click();
      }
    }
  });
});

render();
</script>
