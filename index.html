<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGER — Trade Log</title>
<style>
  :root{
    --bg: #14161b;
    --panel: #1a1d24;
    --line: #2a2e38;
    --ink: #d8dbe2;
    --dim: #7b8092;
    --hit: #4fae7a;
    --miss: #c15a5a;
    --accent: #d8b26a;
    --mono: 'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:24px 16px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-size:15px;
    letter-spacing:0.18em;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  header h1 span{color:var(--accent);}
  header .sub{font-size:11px;color:var(--dim);letter-spacing:0.04em;}

  .stats{
    display:flex;
    gap:0;
    border:1px solid var(--line);
    margin-bottom:16px;
    overflow:hidden;
    border-radius:2px;
  }
  .stat{
    flex:1;
    padding:10px 14px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat .n{font-size:17px;font-weight:600;color:var(--ink);}
  .stat .l{font-size:9px;color:var(--dim);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
  .stat.hitcolor .n{color:var(--hit);}

  form{
    display:grid;
    grid-template-columns: 70px 1fr 130px 90px 90px 80px 84px;
    gap:8px;
    margin-bottom:18px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:10px;
    border-radius:2px;
  }
  form label{
    font-size:9px;
    color:var(--dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  input, select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--mono);
    font-size:12px;
    padding:7px 6px;
    border-radius:2px;
    outline:none;
  }
  input:focus, select:focus{border-color:var(--accent);}
  input[readonly]{color:var(--dim);}
  button{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    cursor:pointer;
    border-radius:2px;
  }
  .addbtn{
    align-self:end;
    background:var(--accent);
    border:1px solid var(--accent);
    color:#14161b;
    font-weight:700;
    padding:8px 0;
    text-transform:uppercase;
  }
  .addbtn:hover{opacity:0.88;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  thead th{
    text-align:left;
    font-size:9px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--dim);
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    font-weight:500;
  }
  tbody td{
    padding:8px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  td.num{color:var(--dim);}
  .tag{
    display:inline-block;
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:2px;
    border:1px solid;
  }
  .tag.long{color:#8fb5d8;border-color:#3a5a78;}
  .tag.short{color:#d8a98f;border-color:#785a3a;}
  .tag.hit{color:var(--hit);border-color:var(--hit);}
  .tag.miss{color:var(--miss);border-color:var(--miss);}
  .rr{color:var(--accent);}
  .del{
    background:none;
    border:none;
    color:var(--dim);
    font-size:13px;
  }
  .del:hover{color:var(--miss);}
  .empty{
    text-align:center;
    color:var(--dim);
    padding:30px 0;
    font-size:11px;
    letter-spacing:0.04em;
  }

  .actions{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .actions button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    padding:8px 14px;
  }
  .actions button:hover{color:var(--ink);border-color:var(--dim);}

  @media (max-width: 640px){
    form{grid-template-columns: 1fr 1fr;}
    table{display:block;overflow-x:auto;}
  }

  @media print{
    body{background:#fff;color:#000;padding:0;}
    form,.actions,.stats{display:none;}
    header{border-color:#000;}
    header h1, header h1 span{color:#000;}
    thead th{color:#000;border-color:#000;}
    tbody td{border-color:#ccc;}
    .tag{border-color:#000 !important;color:#000 !important;}
    .rr{color:#000;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>LEDGER<span>_</span> TRADE LOG</h1>
    <div class="sub" id="dateNow"></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Trades</div></div>
    <div class="stat hitcolor"><div class="n" id="statHitRate">—</div><div class="l">Hit Rate</div></div>
    <div class="stat"><div class="n" id="statAvgRR">—</div><div class="l">Avg R:R</div></div>
  </div>

  <form id="tradeForm">
    <div>
      <label>No.</label>
      <input type="text" id="fSerial" readonly>
    </div>
    <div>
      <label>Asset</label>
      <input type="text" id="fAsset" placeholder="XAUUSD" required autocomplete="off">
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="fDate" required>
    </div>
    <div>
      <label>Dir</label>
      <select id="fDir">
        <option value="long">Long</option>
        <option value="short">Short</option>
      </select>
    </div>
    <div>
      <label>Result</label>
      <select id="fResult">
        <option value="hit">Hit</option>
        <option value="miss">Miss</option>
      </select>
    </div>
    <div>
      <label>R:R</label>
      <input type="text" id="fRR" placeholder="1:2" required autocomplete="off">
    </div>
    <button type="submit" class="addbtn">+ Add</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>No.</th>
        <th>Asset</th>
        <th>Date</th>
        <th>Dir</th>
        <th>Result</th>
        <th>R:R</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">No entries yet — log your first trade above.</div>

  <div class="actions">
    <button id="btnPrint">Print / Save PDF</button>
    <button id="btnCSV">Export CSV</button>
    <button id="btnClear">Clear All</button>
  </div>

</div>

<script>
const STORAGE_KEY = 'ledger_trades_v1';
let trades = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

const tbody = document.getElementById('tbody');
const emptyMsg = document.getElementById('emptyMsg');
const fSerial = document.getElementById('fSerial');
const fAsset = document.getElementById('fAsset');
const fDate = document.getElementById('fDate');
const fDir = document.getElementById('fDir');
const fResult = document.getElementById('fResult');
const fRR = document.getElementById('fRR');

document.getElementById('dateNow').textContent = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
fDate.valueAsDate = new Date();

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
}

function nextSerial(){
  return trades.length ? trades[trades.length-1].serial + 1 : 1;
}

function render(){
  fSerial.value = nextSerial();
  tbody.innerHTML = '';
  if(trades.length === 0){
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    trades.forEach(t=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="num">${String(t.serial).padStart(3,'0')}</td>
        <td>${escapeHtml(t.asset)}</td>
        <td class="num">${formatDate(t.date)}</td>
        <td><span class="tag ${t.dir}">${t.dir}</span></td>
        <td><span class="tag ${t.result}">${t.result}</span></td>
        <td class="rr">${escapeHtml(t.rr)}</td>
        <td><button class="del" data-id="${t.id}" title="Delete">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
  }
  updateStats();
}

function updateStats(){
  const total = trades.length;
  document.getElementById('statTotal').textContent = total;
  if(total === 0){
    document.getElementById('statHitRate').textContent = '—';
    document.getElementById('statAvgRR').textContent = '—';
    return;
  }
  const hits = trades.filter(t=>t.result==='hit').length;
  document.getElementById('statHitRate').textContent = Math.round((hits/total)*100) + '%';

  const rrVals = trades.map(t=>parseRR(t.rr)).filter(v=>v!==null);
  if(rrVals.length){
    const avg = rrVals.reduce((a,b)=>a+b,0)/rrVals.length;
    document.getElementById('statAvgRR').textContent = '1:' + avg.toFixed(1);
  } else {
    document.getElementById('statAvgRR').textContent = '—';
  }
}

function parseRR(rr){
  // accepts "1:2", "1:2.5", or plain "2"
  const m = rr.match(/^\s*1?\s*:?\s*([\d.]+)\s*$/);
  return m ? parseFloat(m[1]) : null;
}

function formatDate(d){
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', {day:'2-digit',month:'short'});
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('tradeForm').addEventListener('submit', function(e){
  e.preventDefault();
  trades.push({
    id: Date.now(),
    serial: nextSerial(),
    asset: fAsset.value.trim().toUpperCase(),
    date: fDate.value,
    dir: fDir.value,
    result: fResult.value,
    rr: fRR.value.trim()
  });
  save();
  fAsset.value = '';
  fRR.value = '';
  fAsset.focus();
  render();
});

tbody.addEventListener('click', function(e){
  if(e.target.classList.contains('del')){
    const id = Number(e.target.dataset.id);
    trades = trades.filter(t=>t.id !== id);
    // renumber serials
    trades.forEach((t,i)=>t.serial = i+1);
    save();
    render();
  }
});

document.getElementById('btnPrint').addEventListener('click', ()=>window.print());

document.getElementById('btnClear').addEventListener('click', ()=>{
  if(confirm('Clear all logged trades? This cannot be undone.')){
    trades = [];
    save();
    render();
  }
});

document.getElementById('btnCSV').addEventListener('click', ()=>{
  if(trades.length === 0) return;
  let csv = 'Serial,Asset,Date,Direction,Result,R:R\n';
  trades.forEach(t=>{
    csv += `${t.serial},${t.asset},${t.date},${t.dir},${t.result},${t.rr}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trade-log-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
</html>
